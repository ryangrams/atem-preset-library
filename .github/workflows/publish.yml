name: Publish library

# Rebuilds the index and pushes the site to Cloudflare Pages. Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN  — a token with Cloudflare Pages · Edit
#   CLOUDFLARE_ACCOUNT_ID — the account the Pages project lives in
on:
  push:
    branches: [main]
    paths: ['packs/**', 'site/**', 'scripts/**']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build-index.mjs
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy --project-name=atem-preset-library --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
