name: Validate packs

# Every submission is a pull request from someone we do not know, so the schema check runs
# before a human looks at it.
on:
  pull_request:
    paths: ['packs/**']
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build-index.mjs --check
