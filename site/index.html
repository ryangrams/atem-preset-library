<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>ATEM Audio Preset Library</title>
		<style>
			:root {
				color-scheme: dark;
				--bg: #141414;
				--panel: #1f1f1f;
				--line: #2f2f2f;
				--text: #e8e8e8;
				--dim: #9a9a9a;
				--cyan: #2ac9e6;
				--good: #3ec97a;
			}
			* { box-sizing: border-box; }
			body {
				margin: 0;
				padding: 32px 20px 60px;
				background: var(--bg);
				color: var(--text);
				font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			}
			main { max-width: 780px; margin: 0 auto; }
			h1 { font-size: 22px; margin: 0 0 4px; }
			.sub { color: var(--dim); margin: 0 0 28px; }
			.pack {
				background: var(--panel);
				border: 1px solid var(--line);
				border-radius: 10px;
				padding: 14px 16px;
				margin-bottom: 10px;
				display: flex;
				gap: 14px;
				align-items: flex-start;
			}
			.pack h2 { font-size: 16px; margin: 0 0 3px; }
			.meta { color: var(--dim); font-size: 13px; }
			.body { flex: 1; min-width: 0; }
			.names { color: var(--dim); font-size: 12.5px; margin-top: 6px; }
			.vote {
				flex: none;
				text-align: center;
				min-width: 62px;
				background: #171717;
				border: 1px solid var(--line);
				border-radius: 8px;
				padding: 6px 8px;
				cursor: pointer;
				color: var(--text);
				font: inherit;
			}
			.vote:hover { border-color: var(--good); }
			.vote b { display: block; font-size: 17px; }
			.vote span { font-size: 11px; color: var(--dim); }
			.vote.voted { border-color: var(--good); color: var(--good); }
			a { color: var(--cyan); }
			.empty { color: var(--dim); }
			footer { max-width: 780px; margin: 30px auto 0; color: var(--dim); font-size: 13px; }
		</style>
	</head>
	<body>
		<main>
			<h1>ATEM Audio Preset Library</h1>
			<p class="sub">
				Shared Fairlight chains for Blackmagic ATEM switchers — load them with
				<a href="https://github.com/ryangrams/atem-audio-presets">ATEM Audio Presets</a>.
			</p>
			<div id="list" class="empty">Loading…</div>
		</main>
		<footer>
			Submit a pack by opening a pull request on
			<a href="https://github.com/ryangrams/atem-preset-library">GitHub</a>. From Studio Upgrade.
		</footer>

		<script>
			// The index is a static file; only the tallies are dynamic, and they come from a Pages
			// Function on this same origin. If it is unreachable the page still lists everything.
			const VOTES_API = '/api'
			const voted = new Set(JSON.parse(localStorage.getItem('voted') ?? '[]'))

			const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c])

			async function main() {
				const list = document.getElementById('list')
				let index
				try {
					index = await (await fetch('index.json', { cache: 'no-cache' })).json()
				} catch {
					list.textContent = 'Could not load the library index.'
					return
				}
				let votes = {}
				try {
					votes = (await (await fetch(`${VOTES_API}/votes`)).json()).votes ?? {}
				} catch {
					/* tallies are a bonus, not a requirement */
				}

				if (!index.packs.length) {
					list.innerHTML = '<p class="empty">No packs yet — yours could be the first.</p>'
					return
				}

				list.className = ''
				list.innerHTML = index.packs
					.slice()
					.sort((a, b) => (votes[b.id] ?? 0) - (votes[a.id] ?? 0) || a.name.localeCompare(b.name))
					.map(
						(p) => `<div class="pack">
							<div class="body">
								<h2>${esc(p.name)}</h2>
								<div class="meta">${p.presetCount} preset${p.presetCount === 1 ? '' : 's'}${p.author ? ` · ${esc(p.author)}` : ''}${p.devices.length ? ` · ${esc(p.devices.join(', '))}` : ''}</div>
								${p.description ? `<div class="meta" style="margin-top:5px">${esc(p.description)}</div>` : ''}
								<div class="names">${p.presets.map((x) => esc(x.name)).join(' · ')}</div>
								<div class="names"><a href="${esc(p.file)}" download>Download pack</a></div>
							</div>
							<button class="vote${voted.has(p.id) ? ' voted' : ''}" data-id="${esc(p.id)}">
								<b>${votes[p.id] ?? 0}</b><span>▲ votes</span>
							</button>
						</div>`
					)
					.join('')

				list.onclick = async (e) => {
					const btn = e.target.closest('.vote')
					if (!btn || voted.has(btn.dataset.id)) return
					btn.disabled = true
					try {
						const r = await (
							await fetch(`${VOTES_API}/vote`, {
								method: 'POST',
								headers: { 'content-type': 'application/json' },
								body: JSON.stringify({ packId: btn.dataset.id }),
							})
						).json()
						btn.querySelector('b').textContent = r.votes ?? '—'
						voted.add(btn.dataset.id)
						localStorage.setItem('voted', JSON.stringify([...voted]))
						btn.classList.add('voted')
					} finally {
						btn.disabled = false
					}
				}
			}
			main()
		</script>
	</body>
</html>
